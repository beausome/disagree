name: disagree
description: Find where your repository contradicts itself - runtime versions, package versions, licenses and lockfiles that disagree across files.
branding:
  icon: git-pull-request
  color: orange

inputs:
  path:
    description: Repository root to check.
    required: false
    default: "."
  strict:
    description: Fail on warnings as well as errors.
    required: false
    default: "false"
  ignore:
    description: Claim kinds to skip, newline separated (python, node, version, license, package-manager, port).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      # Inputs arrive as environment variables rather than being interpolated
      # into the script. `${{ }}` substitution happens before bash parses the
      # text, so an input containing shell metacharacters would otherwise run.
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        python -m pip install --quiet "$ACTION_PATH"

        args=("$INPUT_PATH" --format github)

        # `if` rather than `[ … ] && …`: composite steps run under `set -e`, so a
        # test that evaluates false returns 1 and fails the whole step. That made
        # the action unusable for anyone leaving strict at its default.
        if [ "$INPUT_STRICT" = "true" ]; then
          args+=(--strict)
        fi

        while IFS= read -r kind; do
          if [ -n "$kind" ]; then
            args+=(--ignore "$kind")
          fi
        done <<< "$INPUT_IGNORE"

        disagree "${args[@]}"
